<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CommsAtlas — Sites, comms rooms, racks &amp; patching</title>
  <meta name="description" content="Map every site, plan racks, place devices, document every port, VLAN and patch cable, and print clean rack sheets.">
  <meta name="theme-color" content="#14283c">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/icon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/icon-180.png">
  <script src="/js/theme-boot.js"></script>
  <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/visual-refresh.css">
</head>
<body>
  <div class="app" id="app" data-view="home">
    <header class="topbar">
      <button type="button" class="icon-btn icon-btn--dark nav-toggle" data-act="toggle-nav" aria-label="Menu toggle" aria-controls="sidebar" aria-expanded="false" title="Locations menu">
        <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand" href="/" aria-label="CommsAtlas home"><span id="brandMark"></span></a>
      <span class="ws-name" id="wsName"></span>
      <nav class="crumbs" id="crumbs" aria-label="You are here"></nav>
      <div class="top-actions">
        <button type="button" class="icon-btn icon-btn--dark" id="themeBtn" data-act="theme" aria-haspopup="menu" aria-label="Appearance" title="Appearance"></button>
        <button type="button" class="icon-btn icon-btn--dark" data-act="undo" title="Undo (Ctrl+Z)" aria-label="Undo">
          <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>
        </button>
        <button type="button" class="icon-btn icon-btn--dark" data-act="redo" title="Redo (Ctrl+Y)" aria-label="Redo">
          <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg>
        </button>
        <button type="button" class="top-btn" data-act="help">How it works</button>
        <button type="button" class="top-btn top-btn--primary" data-act="data">Workspace</button>
        <button type="button" class="acct-btn" id="acctBtn" data-act="account" aria-label="Set up sign-in"></button>
      </div>
    </header>

    <aside class="sidebar" id="sidebar" aria-label="Locations">
      <div class="side-search">
        <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
        <input id="search" type="search" placeholder="Search racks, devices, ports, IPs" aria-label="Search racks, devices, ports and IP addresses" autocomplete="off">
      </div>
      <div class="side-head"><span>Locations</span><span class="side-head-btns"><button type="button" class="icon-btn sm" data-act="sort-sites" title="Sort locations" aria-label="Sort locations"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5v14M3.5 15.5L7 19l3.5-3.5M17 19V5M13.5 8.5L17 5l3.5 3.5"/></svg></button><button type="button" class="icon-btn sm" data-add="root" title="Add a location" aria-label="Add a location"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></span></div>
      <div class="tree" id="tree"></div>
      <div class="side-foot">
        <button type="button" class="side-link" data-act="sites-map"><span class="side-ico" data-ico="pin"></span>Site map</button>
        <button type="button" class="side-link" data-act="import-sheet"><span class="side-ico" data-ico="sheet"></span>Import data (Excel, Word, PDF)</button>
        <button type="button" class="side-link" data-act="new-tpl"><span class="side-ico" data-ico="device"></span>Build a device</button>
        <button type="button" class="side-link" data-act="rack-standards"><span class="side-ico" data-ico="rack"></span>Rack standards</button>
        <button type="button" class="side-link" data-act="history"><span class="side-ico" data-ico="history"></span>Change history</button>
        <button type="button" class="side-link" data-act="users"><span class="side-ico" data-ico="users"></span>Users &amp; access</button>
        <button type="button" class="side-link" data-act="data"><span class="side-ico" data-ico="settings"></span>Backup &amp; data</button>
        <button type="button" class="side-link" data-act="connectors"><span class="side-ico" data-ico="link"></span>Connectors</button>
        <button type="button" class="side-link" data-act="help"><span class="side-ico" data-ico="help"></span>How it works</button>
      </div>
    </aside>

    <aside class="library" id="library" aria-label="Device library">
      <div class="lib-head">
        <h2>Device library</h2>
        <button type="button" class="btn sm btn--primary" data-act="new-tpl">+ New</button>
      </div>
      <div class="lib-filters">
        <input id="libSearch" type="search" placeholder="Search the library" aria-label="Search the device library" autocomplete="off">
        <select id="libCat" aria-label="Category"><option value="">All categories</option></select>
      </div>
      <p class="lib-hint">Drag onto a rack unit, or click and then pick a free unit.</p>
      <div class="lib-list" id="libList"></div>
    </aside>

    <main class="main" id="main">
      <div class="viewtabs" id="viewtabs" role="tablist" aria-label="Views"></div>
      <div class="sitebar" id="sitebar"></div>
      <div class="toolbar" id="toolbar"></div>
      <div class="canvas" id="canvas"></div>
      <section class="bottom" id="bottom" aria-label="Devices and connections" hidden></section>
    </main>

    <aside class="inspector" id="inspector" aria-label="Details"></aside>
    <div class="scrim" id="scrim" data-act="scrim"></div>
    <footer class="statusbar" id="statusbar"></footer>
  </div>

  <div id="popover" class="popover" hidden></div>
  <input type="file" id="fileImg" accept="image/*" hidden>
  <noscript><p style="padding:24px">CommsAtlas needs JavaScript switched on.</p></noscript>

  <script src="/config.js"></script>
  <script src="/version.js"></script>
  <script src="/js/util.js"></script>
  <script src="/js/qr.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/ports.js"></script>
  <script src="/js/rack.js"></script>
  <script src="/js/modals.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/srvauth.js"></script>
  <script src="/js/xlsx.js"></script>
  <script src="/js/docimport.js"></script>
  <script src="/js/importer.js"></script>
  <script src="/js/mock-workspace.js"></script>
  <script src="/js/rackstd.js"></script>
  <script src="/js/views.js"></script>
  <script src="/js/plans.js"></script>
  <script src="/js/map.js"></script>
  <script src="/js/sync.js"></script>
  <script src="/js/connectors.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/side-icons.js"></script>
</body>
</html>
