name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Visual assets and references
        run: python3 tools/check_visual_assets.py
      - name: Server checks
        run: dotnet run --project server -c Release -- --selftest
      - name: Build the single-file installer
        shell: pwsh
        run: ./build.ps1 -Notes "CI build ${{ github.sha }}"
      - name: Check the installer without installing
        run: sh release/CommsAtlas-*.run --check
      - uses: actions/upload-artifact@v7
        with:
          name: CommsAtlas-installer
          path: release/CommsAtlas-*.run
          if-no-files-found: error
